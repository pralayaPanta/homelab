<div class="latest-posts">
{{ range sort (where site.RegularPages "Params.posttype" "blog") "Date" "desc" }}
  <div class="mb-6">
    <a href="{{ .RelPermalink }}" class="text-lg font-semibold hover:underline">
      {{ .Title }}
    </a>
    <div class="text-sm opacity-60">{{ .Date.Format "2 January 2006" }}</div>
    <p class="opacity-80">{{ .Summary }}</p>
  </div>
{{ end }}
</div>
