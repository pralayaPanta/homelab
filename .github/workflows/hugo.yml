name: Deploy Hugo site

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0    # Required for enableGitInfo — full history needed for last-modified dates
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.3'  # Pinned — prevents silent breaking changes on new Hugo releases
          extended: true
      - run: hugo --minify
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5